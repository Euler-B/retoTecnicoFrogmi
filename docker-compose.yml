services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USER_DB:-frogmi}
      POSTGRES_PASSWORD: ${PASSWORD_DB:-frogmi}
      POSTGRES_DB: frogmi_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB:-frogmi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      USER_DB: ${USER_DB:-frogmi}
      PASSWORD_DB: ${PASSWORD_DB:-frogmi}
    volumes:
      - ./Backend:/rails
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  pgdata:
