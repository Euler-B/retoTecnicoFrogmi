AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/*'
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'log/**/*'
    - 'tmp/**/*'

# Rails omakase style: no documentation or frozen_string_literal requirements
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# Serializer and task methods are reasonably longer than the default 10
Metrics/MethodLength:
  Max: 30

Metrics/ClassLength:
  Exclude:
    - 'app/controllers/sismos_controller.rb'
    - 'test/controllers/sismos_controller_filters_test.rb'
    - 'test/controllers/sismos_controller_test.rb'
    - 'test/models/sismo_test.rb'

# Rake DSL and specific test suites use long blocks by nature
Metrics/BlockLength:
  Exclude:
    - 'lib/tasks/**/*.rake'
    - 'test/controllers/sismos_controller_filters_test.rb'
    - 'test/controllers/sismos_controller_test.rb'
    - 'test/models/sismo_test.rb'
